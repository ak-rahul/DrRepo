[project]
name = "drrepo"
version = "3.1.0"
description = "Agentic multi-agent AI system that clones and audits public GitHub repositories"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "AK Rahul" }]
keywords = ["github", "repository", "analysis", "ai", "langgraph", "multi-agent", "static-analysis", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "langgraph>=1.2.7,<2",
    "langchain>=1.3.11,<2",
    "langchain-core>=1.4.8,<2",
    "langchain-groq>=1.1.3,<2",
    "langchain-openai>=1.3.3,<2",
    "PyGithub>=2.9.1,<3",
    "httpx>=0.28.1,<1",
    "pydantic>=2.13,<3",
    "python-dotenv>=1.2.2,<2",
    "streamlit>=1.58,<2",
    "fastapi>=0.139,<1",
    "uvicorn[standard]>=0.49,<1",
    # Scanners invoked as subprocesses by the collectors. Shipped as wheels with
    # bundled binaries, so `uv sync` is all a host needs (plus `git`).
    "ruff>=0.15.20",
    "bandit>=1.9.4",
    "semgrep>=1.168.0",
    "mcp>=1.10",
]

[project.urls]
Homepage = "https://github.com/ak-rahul/DrRepo"
Repository = "https://github.com/ak-rahul/DrRepo"
Issues = "https://github.com/ak-rahul/DrRepo/issues"

[project.scripts]
drrepo = "drrepo.interfaces.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pip-audit>=2.10.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Every module imports via `src.xxx` (see "Import hygiene" in CLAUDE.md), so
# the package that gets installed is literally named `src`.
packages = ["src/drrepo"]

[tool.uv]
default-groups = ["dev"]

# ---------------------------------------------------------------- ruff ----

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["reports", "logs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "C4",  # comprehensions
    "RUF", # ruff-specific
    "S",   # bandit (security)
]
ignore = [
    "E501",   # line length is the formatter's job
    "S603",   # subprocess without shell=True: every call here passes a fixed argv list
    "S607",   # partial executable path: git/ruff/bandit/semgrep are resolved on PATH by design
    "RUF001", # ambiguous unicode in strings (emoji/em-dashes in UI text are intentional)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "B017"]
"src/drrepo/recon/scanners.py" = ["S105"] # "secret_scan" is a tool name, not a secret

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy ----

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
ignore_missing_imports = true

# -------------------------------------------------------------- pytest ----

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration' --strict-markers"
timeout = 120
filterwarnings = [
    # Upstream noise from third-party packages, not DrRepo code.
    "ignore::DeprecationWarning:langsmith.*",
    "ignore:Field 'lifespan' has an incomplete definition:UserWarning",
]
markers = [
    "integration: needs real credentials/network (run with `-m integration`)",
]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
