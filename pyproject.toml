[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drrepo"
version = "2.0.0"
description = "Multi-agent AI system for comprehensive GitHub repository analysis"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "AK Rahul"}
]
keywords = ["github", "repository", "analysis", "ai", "langgraph", "multi-agent", "static-analysis", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "langgraph==1.2.7",
    "langchain==1.3.11",
    "langchain-core==1.4.8",
    "langchain-groq==1.1.3",
    "langchain-openai==1.3.3",
    "groq==0.37.1",
    "PyGithub==2.9.1",
    "httpx==0.28.1",
    "ruff==0.15.20",
    "bandit==1.9.4",
    "semgrep==1.168.0",
    "python-dotenv==1.2.2",
    "pydantic==2.13.4",
    "streamlit==1.58.0",
    "fastapi==0.139.0",
    "uvicorn[standard]==0.49.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.4.0",
    "pytest-mock==3.15.1",
    "pytest-timeout==2.4.0",
    "black==26.5.1",
    "flake8==7.3.0",
    "isort==8.0.1",
    "mypy==2.1.0",
    "pip-audit==2.10.1",
    "pre-commit==4.6.0",
]

[project.urls]
Homepage = "https://github.com/ak-rahul/DrRepo"
Repository = "https://github.com/ak-rahul/DrRepo"
Issues = "https://github.com/ak-rahul/DrRepo/issues"

[project.scripts]
drrepo = "src.main:main"

[tool.black]
line-length = 100
target-version = ['py311', 'py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--cov=src --cov-report=html --cov-report=term-missing"
markers = [
    "integration: marks tests as integration tests (deactivate with '-m \"not integration\"')",
]

[tool.mypy]
# Set to the interpreter actually used to run mypy (3.12), not the project's
# minimum supported version (3.11, see requires-python above) -- this only
# controls which syntax mypy accepts while parsing stub files it encounters
# (e.g. numpy's, pulled in transitively by streamlit) and does not allow our
# own code to use 3.12-only syntax.
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/venv/*", "*/.venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv", "build", "dist"]
skips = ["B101", "B601"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
# E501 (line too long) is also ignored by flake8's config below -- black
# already enforces line-length=100 on anything it formats; treating long
# lines as a hard lint failure on top of that is redundant.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally assert on the generic Exception the mocked functions
# raise (circuit breaker / retry decorator tests exercise "any exception"
# passthrough behavior, not a specific exception type).
"tests/*" = ["B017"]
