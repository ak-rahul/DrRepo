[project]
name = "drrepo"
version = "3.1.0"
description = "Agentic multi-agent AI system that clones and audits public GitHub repositories"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "AK Rahul" }]
keywords = ["github", "repository", "analysis", "ai", "langgraph", "multi-agent", "static-analysis", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "langgraph>=1.2.7,<2",
    "langchain>=1.3.11,<2",
    "langchain-core>=1.4.8,<2",
    "langchain-groq>=1.1.3,<2",
    "langchain-openai>=1.3.3,<2",
    "PyGithub>=2.9.1,<3",
    "httpx>=0.28.1,<1",
    "pydantic>=2.13,<3",
    "python-dotenv>=1.2.2,<2",
    "streamlit>=1.58,<2",
    "fastapi>=0.165,<1",
    "uvicorn[standard]>=0.49,<1",
    "mcp>=2.3,<3",
    # Scanners invoked as subprocesses by the collectors. Shipped as wheels with
    # bundled binaries, so `uv sync` is all a host needs (plus `git`).
    # semgrep is deliberately NOT listed: it hard-pins mcp/opentelemetry/wcmatch
    # to vulnerable versions. Install it as an isolated tool: `uv tool install semgrep`.
    "ruff>=0.15.20",
    "bandit>=1.9.4",
    "filelock>=3.16,<5",
    "regex>=2024.11.6",
    "zizmor>=1.33",
    "hadolint-py>=2.15.1.3",
]

[project.urls]
Homepage = "https://github.com/ak-rahul/DrRepo"
Repository = "https://github.com/ak-rahul/DrRepo"
Issues = "https://github.com/ak-rahul/DrRepo/issues"

[project.scripts]
drrepo = "drrepo.interfaces.cli:main"

[project.optional-dependencies]
anthropic = [
    "langchain-anthropic>=1.0,<2",
]
ollama = [
    "langchain-ollama>=1.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pip-audit>=2.10.1",
    "jsonschema>=4.23",
    "cyclonedx-python-lib[json-validation]>=11.13.0",
    "pyyaml>=6.0",
    "poethepoet>=0.49.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src layout: the importable package is `drrepo`.
packages = ["src/drrepo"]

[tool.hatch.build.targets.sdist]
# Allow-list: local files (agent notes, editor settings, logs) never ship.
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/README.md",
    "/LICENSE.md",
    "/CHANGELOG.md",
    "/SECURITY.md",
    "/CONTRIBUTING.md",
    "/pyproject.toml",
    "/uv.lock",
    "/action.yml",
]
exclude = ["__pycache__"]

[tool.uv]
default-groups = ["dev"]

# ---------------------------------------------------------------- ruff ----

# Short commands: `uv run poe <task> [args]` (`uv run poe` lists them). Extra args pass through.
[tool.poe.tasks]
test = { cmd = "pytest", help = "unit tests (hermetic)" }
integration = { cmd = "pytest -m integration", help = "live tests (network, API keys)" }
cov = { cmd = "pytest --cov", help = "unit tests with coverage" }
lint = { cmd = "ruff check src tests examples", help = "lint" }
fmt = { cmd = "ruff format src tests examples", help = "format" }
types = { cmd = "mypy src examples", help = "type-check (strict)" }
fix = { sequence = ["fmt", { cmd = "ruff check --fix src tests examples" }], help = "format and auto-fix" }
check = { cmd = "pre-commit run --all-files", help = "everything CI's lint job runs" }

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["reports", "logs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "C4",  # comprehensions
    "RUF", # ruff-specific
    "S",   # bandit (security)
    "PIE", # unnecessary code
    "PERF",# performance anti-patterns
    "FURB",# modernizations
    "LOG", # logging misuse
    "DTZ", # naive datetimes
    "PTH", # pathlib over os.path
    "PLW", # pylint warnings
]
ignore = [
    "E501",   # line length is the formatter's job
    "S603",   # subprocess without shell=True: every call here passes a fixed argv list
    "S607",   # partial executable path: git/ruff/bandit/semgrep are resolved on PATH by design
    "RUF001", # ambiguous unicode in strings (emoji/em-dashes in UI text are intentional)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "B017"]
"src/drrepo/recon/scanners.py" = ["S105"] # "secret_scan" is a tool name, not a secret

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy ----

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true


# -------------------------------------------------------------- pytest ----

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration' --strict-markers"
timeout = 120
filterwarnings = [
    # Upstream noise from third-party packages, not DrRepo code.
    "ignore::DeprecationWarning:langsmith.*",
    "ignore:Field 'lifespan' has an incomplete definition:UserWarning",
]
markers = [
    "integration: needs real credentials/network (run with `-m integration`)",
]

[tool.coverage.run]
# By path, not package: AppTest runs streamlit_app.py as __main__, which a
# package-based source (--cov=drrepo) never matches.
source = ["src/drrepo"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
