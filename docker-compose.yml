# docker compose up            -> Streamlit UI on http://localhost:8501
# One-off CLI run:
#   docker compose run --rm ui drrepo audit https://github.com/psf/requests
#
# The port is published on 127.0.0.1 only: the UI has no authentication.

x-drrepo: &drrepo
  build: .
  image: drrepo:latest
  env_file:
    - path: .env
      required: false
  volumes:
    - ./reports:/app/reports
    - ./logs:/app/logs
  restart: unless-stopped

services:
  ui:
    <<: *drrepo
    container_name: drrepo-ui
    ports:
      - "127.0.0.1:8501:8501"
