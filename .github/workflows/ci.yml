name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Keep in step with SEMGREP_VERSION in the Dockerfile.
  SEMGREP_VERSION: "1.187.0"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv sync --locked
      # One source of truth with local development: ruff, strict mypy, uv.lock
      # sync, zizmor/actionlint (workflows), hadolint, and schema validation.
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv build
      - run: uvx twine check --strict dist/*
      # Install the wheel alone (no repo checkout on the path) and run the entry point.
      - run: |
          uv venv /tmp/wheel-env
          uv pip install --python /tmp/wheel-env dist/*.whl
          /tmp/wheel-env/bin/drrepo --version
          /tmp/wheel-env/bin/python -c "import drrepo.interfaces.mcp_server, drrepo.pipeline"
          # Agent instructions are package data; make sure they shipped.
          /tmp/wheel-env/bin/python -c "from drrepo.agents.prompts import validate_all; validate_all()"
          /tmp/wheel-env/bin/python -c "from drrepo.report.schema import load_schema; load_schema()"

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-extras  # optional providers too, so their tests run
      # Hermetic: no secrets, no network (an autouse fixture blocks real HTTP).
      - run: uv run pytest --cov --cov-report=term --cov-report=xml

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv export --frozen --no-dev --all-extras --no-emit-project -o requirements.audit.txt
      - run: uvx pip-audit -r requirements.audit.txt --disable-pip

  integration:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv sync --locked
      # Isolated tool env: as a project dependency semgrep pins vulnerable mcp/otel.
      - run: uv tool install "semgrep==${SEMGREP_VERSION}"
      - run: uv run pytest -m integration -v
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
      # Shallow evaluation set vs. evals/baseline.json. The baseline is recorded
      # without semgrep, so semgrep stays off here too; the table goes to the job summary.
      - name: Evaluation set
        run: uv run drrepo eval --log-file "" -o eval.md
        env:
          ENABLE_SEMGREP: "false"
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
      - name: Publish evaluation table
        if: always()
        run: test -f eval.md && cat eval.md >> "$GITHUB_STEP_SUMMARY" || true

  # The composite action in action.yml, run from this checkout on a pinned public repository.
  action:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Run the action
        id: drrepo
        # Deliberately the checkout, not `$/`: this job tests the action as changed by the push or PR.
        uses: ./ # zizmor: ignore[self-repository]
        with:
          repository: pallets/itsdangerous
          ref: 096c8d42545d3b68ea21a4f890fb2b2d8979c0bd # 2.2.0, also in evals/repos.toml
          formats: json,cdx
          upload-sarif: "false"
          fail-under: "1"
          github-token: ${{ secrets.GH_TOKEN || github.token }}
      - name: Check the outputs
        env:
          SCORE: ${{ steps.drrepo.outputs.score }}
          GRADE: ${{ steps.drrepo.outputs.grade }}
          REPORT: ${{ steps.drrepo.outputs.report }}
        run: |
          test -n "${SCORE}" && test -n "${GRADE}" && test -s "${REPORT}"
          ls drrepo-report/*.cdx.json drrepo-report/*.summary.md
          echo "score ${SCORE} (${GRADE})"

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          load: true
          build-args: SEMGREP_VERSION=${{ env.SEMGREP_VERSION }}
          tags: drrepo:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the image
        run: |
          docker run --rm drrepo:ci drrepo --version
          docker run --rm drrepo:ci semgrep --version
          docker run --rm drrepo:ci git --version
          docker run --rm drrepo:ci sh -c 'test "$(id -u)" != 0'
