name: DrRepo CI/CD Pipeline
on: [push, pull_request]

jobs:
  test-unit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install -r requirements.txt -r requirements-dev.txt
    # No secrets here on purpose: the unit suite is hermetic (see conftest.py)
    # and must pass with zero environment variables set.
    - run: pytest --cov=src --cov-report=xml tests/ -v -m "not integration"

  test-integration:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install -r requirements.txt -r requirements-dev.txt
    - env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: pytest tests/ -v -m integration

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install -r requirements.txt -r requirements-dev.txt
    - run: ruff check src/ tests/ app.py
    - run: black --check src/ tests/ app.py
    - run: isort --check-only src/ tests/ app.py
    - run: flake8 src/ tests/
    - run: mypy src/ --ignore-missing-imports

  docker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - name: Build Docker
      run: docker build -t drrepo:test .
