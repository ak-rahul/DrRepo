# Drop into .github/workflows/drrepo.yml of the repository you want audited.
# DrRepo analyzes the public GitHub copy of the repository at the pushed commit
# (or the pull request head), not the CI checkout, so the repository must be public.
name: DrRepo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly: new advisories appear without any code change

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
      pull-requests: write # the summary comment
    steps:
      - name: DrRepo
        id: drrepo
        # Pin a release commit SHA when you copy this; `main` keeps the example current.
        uses: ak-rahul/DrRepo@main # zizmor: ignore[unpinned-uses]
        with:
          # On pull requests, report what the change made better or worse.
          mode: ${{ github.event_name == 'pull_request' && 'diff' || 'full' }}
          fail-on-new: high # diff mode: fail on a new or worsened high/critical issue
          fail-under: "60"
          formats: md,cdx # Markdown report and CycloneDX SBOM; SARIF is added for upload
          comment: ${{ github.event_name == 'pull_request' }}
          # Honors .drrepo.toml in your repository. Pull requests from forks can edit that
          # file, so drop this line if forks can trigger the workflow.
          trust-repo-suppressions: "true"
        env:
          # Optional: LLM summaries. Add `deep: "true"` above to allow deep investigations.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: drrepo-report
          path: drrepo-report/
