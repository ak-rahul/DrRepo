# Install: uv run pre-commit install
# Run all: uv run pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.10
    hooks:
      - id: uv-lock # keep uv.lock in sync with pyproject.toml

  # Local hooks run the exact tool versions pinned in uv.lock, so pre-commit,
  # CI, and your editor can never disagree.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy src examples
        language: system
        types: [python]
        pass_filenames: false

  # Schema validation for GitHub workflows, Dependabot, and the compose file.
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.39.0
    hooks:
      - id: check-github-workflows
      - id: check-dependabot
      - id: check-compose-spec

  # Workflow and Dockerfile linters (pinned; run only when those files change).
  - repo: local
    hooks:
      - id: zizmor
        name: zizmor (GitHub Actions security)
        entry: uvx zizmor@1.33.1 --offline
        language: system
        files: ^(\.github/workflows/.*|examples/github-workflow)\.ya?ml$
      - id: actionlint
        name: actionlint
        entry: uvx --from actionlint-py==1.7.12.25 actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
      - id: hadolint
        name: hadolint
        entry: uvx --from hadolint-py==2.15.1.3 hadolint
        language: system
        files: (^|/)Dockerfile$
